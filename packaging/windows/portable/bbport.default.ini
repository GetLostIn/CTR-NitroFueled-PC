# bbport settings (in-game menu: Insert / L3+R3)
menu_language=en
upscaler=off
preset=0
show_fps=0
patch_60fps=1
patch_no_motion_blur=1
patch_pro_1080p=0
render_res=1080
temporal=fsr1
dlss_quality=auto
dlss_output=1080
dlss_model=transformer
fsr3_sharpness=0.30
framegen=off
framegen_motion=flow
# v0.4 native ultrawide (Settings > Display > Aspect ratio): 16:9 (off),
# 21:9 (needs a 2560x1080 or 3440x1440 output) or 32:9 (needs 5120x1440).
# Upscaling is off while 21:9/32:9 is on; internal resolution is capped at 1440p.
aspect_ratio=16:9
output_res=1920x1080
fps_limit=60
async_pipelines=0
fullscreen=0
# Online play with a private server (docs/sacredfire/15-online.md); empty: offline.
online_server=
msaa=1
graphics_tab=1
