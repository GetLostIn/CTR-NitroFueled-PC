name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scripts:
    name: Scripts and launcher checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # scripts/isa_rewrite.py scans the linked image with iced-x86 (docs/sacredfire/15-isa-rewrite.md).
      - name: Python packages
        run: pip install iced-x86
      # The preparation, linking, game-check, patch and mod scripts, with synthetic fixtures. Tests
      # that need the built executable skip here (they run with `bash build.sh --test`).
      - name: Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: bash -n run.sh build.sh launcher/bb-launcher.sh launcher/install-desktop.sh packaging/appimage.sh
      - name: Launcher compiles
        run: python3 -m py_compile launcher/sacredfire_launcher.py launcher/bbport_i18n.py launcher/bbport_vulkan.py tools/gen_import_names.py scripts/*.py
      - name: Patch file parses
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('patches/CrashTeamRacing.xml'); print('ok')"
